name: GNAT Studio - macOS ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build GNAT Studio on macOS ARM64
    runs-on: macos-26

    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      PYTHON_VERSION: '3.13'
      ALIRE_VERSION: '2.1.1'
      ALIRE_PREFIX: '${{ github.workspace }}/.ci/alire_prefix'
      GNATCOLL_PYTHON_PREFIX: '${{ github.workspace }}/.ci/gnatcoll-python3'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Inspect runner
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          echo "uname -m: $(uname -m)"
          echo "arch: $(arch)"
          test "$(uname -m)" = arm64
          test "$(arch)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Configure native ARM Homebrew
        shell: bash
        run: |
          set -euxo pipefail

          BREW_PREFIX="$(/usr/bin/arch -arm64 /usr/bin/env brew --prefix)"
          test "$BREW_PREFIX" = "/opt/homebrew"

          echo "BREW_PREFIX=${BREW_PREFIX}" >> "$GITHUB_ENV"

          mkdir -p "$GITHUB_WORKSPACE/.ci/bin"

          cat > "$GITHUB_WORKSPACE/.ci/bin/brew" <<'EOF'
          #!/bin/bash
          set -e
          exec /usr/bin/arch -arm64 /opt/homebrew/bin/brew "$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/.ci/bin/brew"

          echo "$GITHUB_WORKSPACE/.ci/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"

          export PATH="$GITHUB_WORKSPACE/.ci/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

          command -v brew
          file "$(command -v brew)"
          brew --version
          /usr/bin/arch -arm64 brew --version >/dev/null
          file /opt/homebrew/bin/brew

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/.ci/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

          brew install \
            make pkgconf gtk+3 gobject-introspection \
            pygobject3 py3cairo "python@${PYTHON_VERSION}" \
            dylibbundler autoconf automake libtool autoconf-archive

          GTK_PREFIX="$(brew --prefix gtk+3)"
          PYTHON_PREFIX="$(brew --prefix "python@${PYTHON_VERSION}")"

          echo "GTK_PREFIX=${GTK_PREFIX}" >> "$GITHUB_ENV"
          echo "PYTHON_PREFIX=${PYTHON_PREFIX}" >> "$GITHUB_ENV"

          echo "${BREW_PREFIX}/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "${PYTHON_PREFIX}/bin" >> "$GITHUB_PATH"

          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${PYTHON_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PATH}"

          command -v make
          command -v pkg-config
          make --version | head -1
          pkg-config --modversion gtk+-3.0
          "${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}" --version

          echo "--- pygobject3 deps ---"
          brew deps --tree pygobject3 2>/dev/null | head -20 || true

      - name: Install native ARM64 Alire
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .ci/alire_bin
          mkdir -p .ci/alire_bin
          cd .ci/alire_bin

          for i in 1 2 3 4 5; do
            curl -fL -o alire.zip \
              "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-aarch64-macos.zip" && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          test -f alire.zip

          unzip -q -o alire.zip "bin/alr*"
          rm alire.zip
          chmod +x bin/alr*

          file "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr"
          "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr" --version
          file "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr" | grep -qi arm64

          echo "$GITHUB_WORKSPACE/.ci/alire_bin/bin" >> "$GITHUB_PATH"

      - name: Install GNAT / GPRBuild through native Alire
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/.ci/bin:$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          ALR="$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr"
          rm -rf "$ALIRE_PREFIX"

          "$ALR" -n install \
            gnat_native=16.1.0 \
            gprbuild=26.0.1 \
            --prefix="$ALIRE_PREFIX"

          test -x "$ALIRE_PREFIX/bin/gnat"
          test -x "$ALIRE_PREFIX/bin/gprbuild"

          echo "$ALIRE_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Check Ada toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ALIRE_PREFIX/bin:$GITHUB_WORKSPACE/.ci/bin:$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          command -v alr
          command -v gnat
          command -v gprbuild

          echo '--- Toolchain ---'
          alr --version
          gnat --version
          gprbuild --version

          echo '--- Architecture ---'
          file "$(command -v alr)"
          file "$(command -v gnat)"
          file "$(command -v gprbuild)"

      - name: Resolve GNAT Studio Ada dependencies
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/.ci/bin:$ALIRE_PREFIX/bin:$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          for _ in 1 2 3; do
            curl -sf https://github.com >/dev/null 2>&1 && break || sleep 2
          done

          alr toolchain --select gnat_native=16.1.0 gprbuild=26.0.1

          rm -rf .ci/gnatstudio-deps
          mkdir -p .ci/gnatstudio-deps
          cd .ci/gnatstudio-deps

          alr -n init --bin gnatstudiodeps
          cd gnatstudiodeps

          for dep in "gtkada=26.0.0" "xmlada=26.0.0" "gnatcoll=26.0.0" \
                     "gnatcoll_projects=26.0.0" "vss_extra=26.2.0" "vss_text=26.2.0"; do
            ok=0
            for attempt in 1 2 3; do
              if alr with "${dep}"; then ok=1; break; fi
              echo "retry alr with ${dep} (attempt ${attempt})"
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::alr with ${dep} failed after 3 attempts"; exit 1; }
          done

          alr update

          echo "--- alire.toml ---"
          cat alire.toml

          alr printenv --unix > "$GITHUB_WORKSPACE/.ci/alire-env.sh"

          echo '--- Alire environment ---'
          cat "$GITHUB_WORKSPACE/.ci/alire-env.sh"

      - name: Generate _shared.gpr stubs from templates
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${PATH}"

          echo "--- Generating _shared.gpr stubs from .gpr.in templates ---"

          # Find the GTK prefix via pkg-config
          GTK_PREFIX="$(pkg-config gtk+-3.0 --variable=prefix 2>/dev/null || echo /opt/homebrew)"
          echo "GTK_PREFIX=${GTK_PREFIX}"

          # Find all _shared.gpr.in files in the Alire build cache and generate .gpr stubs
          generated=0
          for gpr_in in $(find "${HOME}/.local/share/alire/builds" -name "*_shared.gpr.in" 2>/dev/null); do
            gpr_out="${gpr_in%.in}"
            if [ ! -f "${gpr_out}" ]; then
              sed \
                -e 's/@PACKAGE_VERSION@/26.0.0/g' \
                -e 's/@DEFAULT_LIBRARY_TYPE@/static/g' \
                -e 's/@BUILD_TYPE@/Production/g' \
                -e 's/@SO_EXT@/.dylib/g' \
                -e 's/@NEED_OBJECTIVE_C@/no/g' \
                -e "s|@GTK_PREFIX@|${GTK_PREFIX}|g" \
                -e 's/@GTK_CFLAGS_GPR@//g' \
                -e 's/@GTK_LIBS_GPR@//g' \
                -e 's/@OBJC@/clang/g' \
                -e 's/@PROCESSORS@/0/g' \
                "${gpr_in}" > "${gpr_out}"
              echo "Generated: ${gpr_out}"
              generated=$((generated + 1))
            fi
          done

          echo "Generated ${generated} _shared.gpr stubs"

          # Verify the key stubs exist
          echo "--- Verifying key project files ---"
          for name in xmlada_shared gtkada_shared; do
            found="$(find "${HOME}/.local/share/alire/builds" -name "${name}.gpr" 2>/dev/null | head -1)"
            if [ -n "${found}" ]; then
              echo "OK: ${found}"
            else
              echo "WARNING: ${name}.gpr not found"
            fi
          done

          # Verify gtk.gpr is findable (system GTK+3 project from Homebrew)
          gtk_gpr="$(find "${GTK_PREFIX}" -name "gtk.gpr" 2>/dev/null | head -1)"
          if [ -n "${gtk_gpr}" ]; then
            gtk_gpr_dir="$(dirname "${gtk_gpr}")"
            echo "Found system gtk.gpr: ${gtk_gpr}"
            # Make sure it's on GPR_PROJECT_PATH
            if echo "${GPR_PROJECT_PATH}" | tr ':' '\n' | grep -qFx "${gtk_gpr_dir}"; then
              echo "gtk.gpr dir already on GPR_PROJECT_PATH"
            else
              echo "Adding gtk.gpr dir to GPR_PROJECT_PATH: ${gtk_gpr_dir}"
              GPR_PROJECT_PATH="${gtk_gpr_dir}:${GPR_PROJECT_PATH}"
            fi
          else
            echo "WARNING: system gtk.gpr not found under ${GTK_PREFIX}"
          fi

          # Update GPR_PROJECT_PATH in alire-env.sh with any additions
          if [ "${GPR_PROJECT_PATH}" != "$(grep '^export GPR_PROJECT_PATH=' "$GITHUB_WORKSPACE/.ci/alire-env.sh" | sed 's/^export GPR_PROJECT_PATH="//;s/"$//')" ]; then
            sed -i.bak "s|^export GPR_PROJECT_PATH=.*|export GPR_PROJECT_PATH=\\\"${GPR_PROJECT_PATH}\\\"|" \
              "$GITHUB_WORKSPACE/.ci/alire-env.sh"
          fi

          echo "--- Final GPR_PROJECT_PATH ---"
          echo "${GPR_PROJECT_PATH}" | tr ':' '\n'

          # Alire source-only cache: gprls (AM_PATH_GTKADA) needs obj/lib dirs that only exist after building
          echo "--- Creating missing build directories for GPR projects ---"
          for gtkada_src in $(find "${HOME}/.local/share/alire/builds" -path "*/gtkada_*/src" -type d 2>/dev/null); do
            mkdir -p "${gtkada_src}/obj/gtkada/relocatable"
            mkdir -p "${gtkada_src}/lib/gtkada/relocatable"
          done
          for xmlada_dir in $(find "${HOME}/.local/share/alire/builds" -path "*/xmlada_*" -type d -mindepth 1 -maxdepth 1 2>/dev/null); do
            for subdir in input_sources unicode sax dom schema xmlada; do
              mkdir -p "${xmlada_dir}/obj/${subdir}/relocatable"
              mkdir -p "${xmlada_dir}/lib/${subdir}/relocatable"
            done
          done

      - name: Build GNATcoll Python 3 binding
        shell: bash
        run: |
          set -euxo pipefail

          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"
          export PYTHON="${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}"

          rm -rf .ci/gnatcoll-bindings
          git clone --depth 1 --branch v26.0.0 https://github.com/AdaCore/gnatcoll-bindings.git .ci/gnatcoll-bindings

          cd .ci/gnatcoll-bindings/python3

          PYTHON_CFLAGS="-I$("${PYTHON}" -c 'import sysconfig; print(sysconfig.get_path("include"))')"
          PYTHON_LIBS="-L$("${PYTHON}" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))') -lpython${PYTHON_VERSION}"

          GPRBUILD_REAL="$(find "${HOME}/.local/share/alire/toolchains" "${ALIRE_PREFIX}/bin" -name gprbuild -type f 2>/dev/null | head -1)"

          AP_FLAGS=""
          OLD_IFS="${IFS}"
          IFS=":"
          for p in ${GPR_PROJECT_PATH}; do
            [ -d "${p}" ] && AP_FLAGS="${AP_FLAGS} -aP ${p}"
          done
          IFS="${OLD_IFS}"
          echo "Extra -aP flags: ${AP_FLAGS}"

          "${GPRBUILD_REAL}" -j0 -p \
            ${AP_FLAGS} \
            -Pgnatcoll_python.gpr \
            -XGNATCOLL_PYTHON_CFLAGS="${PYTHON_CFLAGS}" \
            -XGNATCOLL_PYTHON_LIBS="${PYTHON_LIBS}" \
            -XGNATCOLL_LIBPYTHON_KIND=shared \
            -XGNATCOLL_VERSION=0.0 \
            -XBUILD=PROD \
            -XGNATCOLL_OS=osx \
            -XLIBRARY_TYPE=static \
            -XXMLADA_BUILD=static \
            -XGPR_BUILD=static

          mkdir -p "${GNATCOLL_PYTHON_PREFIX}/lib"
          mkdir -p "${GNATCOLL_PYTHON_PREFIX}/share/gpr"
          cp -v lib/*.a "${GNATCOLL_PYTHON_PREFIX}/lib/" 2>/dev/null || true
          cp -v lib/*.so "${GNATCOLL_PYTHON_PREFIX}/lib/" 2>/dev/null || true
          cp -v lib/*.dylib "${GNATCOLL_PYTHON_PREFIX}/lib/" 2>/dev/null || true
          cp -v lib/gnatcoll_python3*.ali "${GNATCOLL_PYTHON_PREFIX}/lib/" 2>/dev/null || true
          cp -v gnatcoll_python.gpr "${GNATCOLL_PYTHON_PREFIX}/share/gpr/" 2>/dev/null || true

      - name: Compose GPR environment
        shell: bash
        run: |
          set -euxo pipefail

          source .ci/alire-env.sh

          ALIRE_EXTRA_PATHS=""
          for p in $(echo "${GPR_PROJECT_PATH}" | tr ':' ' '); do
            [ -d "${p}" ] || continue
            parent="$(dirname "${p}")"
            if ls "${parent}"/*.gpr >/dev/null 2>&1; then
              ALIRE_EXTRA_PATHS="${ALIRE_EXTRA_PATHS}:${parent}"
            fi
            grandparent="$(dirname "${parent}")"
            if [ "${grandparent}" != "${parent}" ] && ls "${grandparent}"/*.gpr >/dev/null 2>&1; then
              ALIRE_EXTRA_PATHS="${ALIRE_EXTRA_PATHS}:${grandparent}"
            fi
          done
          echo "ALIRE_EXTRA_PATHS=${ALIRE_EXTRA_PATHS}"

          GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr${ALIRE_EXTRA_PATHS}:${GPR_PROJECT_PATH:-}"
          ADA_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr${ALIRE_EXTRA_PATHS}:${ADA_PROJECT_PATH:-}"
          LIBRARY_PATH="${GNATCOLL_PYTHON_PREFIX}/lib:${LIBRARY_PATH:-}"
          DYLD_LIBRARY_PATH="${GNATCOLL_PYTHON_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"

          sed -i.bak "s|^export GPR_PROJECT_PATH=.*|export GPR_PROJECT_PATH=\\\"${GPR_PROJECT_PATH}\\\"|" \
            "$GITHUB_WORKSPACE/.ci/alire-env.sh"

          echo "GPR_PROJECT_PATH=${GPR_PROJECT_PATH}" >> "$GITHUB_ENV"
          echo "ADA_PROJECT_PATH=${ADA_PROJECT_PATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

          find "${GNATCOLL_PYTHON_PREFIX}/share/gpr" -maxdepth 1 -type f -print | sort

      - name: Build xmlada
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${PATH}"

          XMLADA_DIR=$(find "${HOME}/.local/share/alire/builds" -path "*/xmlada_*" -type d -mindepth 1 -maxdepth 1 2>/dev/null | head -1)
          echo "Building xmlada in ${XMLADA_DIR}"
          cd "${XMLADA_DIR}"

          gprbuild -j"$(sysctl -n hw.ncpu)" -p -Pxmlada.gpr \
            -XXMLADA_BUILD=relocatable \
            -XLIBRARY_TYPE=relocatable \
            -XBUILD=Production

      - name: Build gtkada
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${PATH}"

          GTKADA_DIR=$(find "${HOME}/.local/share/alire/builds" -path "*/gtkada_*" -type d -mindepth 1 -maxdepth 1 2>/dev/null | head -1)
          echo "Building gtkada in ${GTKADA_DIR}"
          cd "${GTKADA_DIR}"

          SHARED_GPR=$(find "${GTKADA_DIR}" -name "gtkada_shared.gpr" -type f 2>/dev/null | head -1)
          echo "Patching: ${SHARED_GPR}"
          echo "=== Before ==="
          grep -n "Switches" "${SHARED_GPR}" | head -5

          sed -i.bak 's/for Compiler_Switches ("ada") use/for Compiler_Switches ("ada") use ("-gnatX",/' "${SHARED_GPR}"
          sed -i.bak 's/for Default_Switches ("ada") use/for Default_Switches ("ada") use ("-gnatX",/' "${SHARED_GPR}"
          sed -i.bak 's/for Switches ("ada") use/for Switches ("ada") use ("-gnatX",/' "${SHARED_GPR}"

          echo "=== After ==="
          grep -n "gnatX" "${SHARED_GPR}" || echo "(gnatX NOT found!)"

          gprbuild -j"$(sysctl -n hw.ncpu)" -p -Pgtkada.gpr \
            -XXMLADA_BUILD=relocatable \
            -XLIBRARY_TYPE=relocatable \
            -XBUILD=Production

      - name: Regenerate configure (update ax_python_devel.m4)
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PATH}"

          cp "$(brew --prefix autoconf-archive)/share/aclocal/ax_python_devel.m4" m4/
          echo "--- Updated ax_python_devel.m4 ---"
          head -10 m4/ax_python_devel.m4

          autoreconf -fi

      - name: Configure GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh

          ALIRE_EXTRA_PATHS=""
          for p in $(echo "${GPR_PROJECT_PATH}" | tr ':' ' '); do
            [ -d "${p}" ] || continue
            parent="$(dirname "${p}")"
            if ls "${parent}"/*.gpr >/dev/null 2>&1; then
              ALIRE_EXTRA_PATHS="${ALIRE_EXTRA_PATHS}:${parent}"
            fi
            grandparent="$(dirname "${parent}")"
            if [ "${grandparent}" != "${parent}" ] && ls "${grandparent}"/*.gpr >/dev/null 2>&1; then
              ALIRE_EXTRA_PATHS="${ALIRE_EXTRA_PATHS}:${grandparent}"
            fi
          done
          echo "ALIRE_EXTRA_PATHS=${ALIRE_EXTRA_PATHS}"

          export GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr${ALIRE_EXTRA_PATHS}:${GPR_PROJECT_PATH:-}"
          export ADA_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr${ALIRE_EXTRA_PATHS}:${ADA_PROJECT_PATH:-}"
          export LIBRARY_TYPE=static
          export PATH="${PYTHON_PREFIX}/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"

          echo "--- GPR_PROJECT_PATH ---"
          echo "${GPR_PROJECT_PATH}" | tr ':' '\n'
          echo "--- Searching for xmlada.gpr ---"
          find "${HOME}/.local/share/alire/builds" -name "xmlada.gpr" 2>/dev/null
          echo "--- Searching for gtkada.gpr ---"
          find "${HOME}/.local/share/alire/builds" -name "gtkada.gpr" 2>/dev/null

          ./configure \
            --prefix="$GITHUB_WORKSPACE/_install" \
            PYTHON="${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}"

      - name: Upload config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: config-log
          path: config.log
          if-no-files-found: warn

      - name: Build GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"

          make BUILD=Production -j"$(sysctl -n hw.ncpu)"

      - name: Install GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"

          make install-strip prefix="$GITHUB_WORKSPACE/_install"

          test -x _install/bin/gnatstudio_exe
          test -x _install/bin/gnatstudio

          file _install/bin/gnatstudio_exe
          otool -hv _install/bin/gnatstudio_exe

      - name: Bundle and sign app
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"

          APP_DIR="$GITHUB_WORKSPACE/_install/GNATStudio.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Frameworks"
          cp _install/bin/gnatstudio_exe "$APP_DIR/Contents/MacOS/"
          cp _install/bin/gnatstudio "$APP_DIR/Contents/MacOS/"

          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleName</key><string>GNAT Studio</string>' \
            '  <key>CFBundleIdentifier</key><string>com.adacore.gnatstudio</string>' \
            '  <key>CFBundleVersion</key><string>0.0</string>' \
            '  <key>CFBundleExecutable</key><string>gnatstudio</string>' \
            '  <key>LSMinimumSystemVersion</key><string>13.0</string>' \
            '</dict>' \
            '</plist>' \
            > "$APP_DIR/Contents/Info.plist"

          BINARY="$APP_DIR/Contents/MacOS/gnatstudio_exe"
          GTK_LIB="$(brew --prefix gtk+3)/lib"
          PYTHON_FRAMEWORK="$(brew --prefix "python@${PYTHON_VERSION}")/Frameworks/Python.framework/Versions/${PYTHON_VERSION}"

          dylibbundler \
            -od -b \
            -x "$BINARY" \
            -d "$APP_DIR/Contents/Frameworks" \
            -p @executable_path/../Frameworks \
            -s "$GTK_LIB" || true

          install_name_tool -add_rpath "@executable_path/../Frameworks" "$BINARY" 2>/dev/null || true

          codesign --force --deep --sign - "$APP_DIR"

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: gnatstudio-macos-arm64-${{ github.sha }}
          path: _install
          if-no-files-found: error
