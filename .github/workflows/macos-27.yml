name: GNAT Studio - macOS 27 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos-27:
    name: Build GNAT Studio on macOS 27 ARM64
    runs-on: xcode-27

    env:
      MACOSX_DEPLOYMENT_TARGET: '27.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      PYTHON_VERSION: '3.14'
      ALIRE_VERSION: '2.1.1'
      ALIRE_PREFIX: '${{ github.workspace }}/.ci/alire_prefix'
      GNATCOLL_PYTHON_PREFIX: '${{ github.workspace }}/.ci/gnatcoll-python3'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Inspect runner architecture
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          test "$(uname -m)" = arm64
          test "$(arch)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Configure native ARM Homebrew
        shell: bash
        run: |
          set -euxo pipefail

          # GitHub's ARM64 runner uses the ARM Homebrew prefix.
          BREW_PREFIX="$(arch -arm64 brew --prefix)"

          echo "BREW_PREFIX=${BREW_PREFIX}" >> "$GITHUB_ENV"
          echo "${BREW_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "${BREW_PREFIX}/sbin" >> "$GITHUB_PATH"

          arch -arm64 brew --version
          arch -arm64 brew config | sed -n '1,80p'

          test -x "${BREW_PREFIX}/bin/brew"

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail

          arch -arm64 brew install             make             pkgconf             gtk+3             gobject-introspection             pygobject3             py3cairo             python@3.14             dylibbundler

          BREW_PREFIX="${BREW_PREFIX:-$(arch -arm64 brew --prefix)}"
          GTK_PREFIX="$(arch -arm64 brew --prefix gtk+3)"
          PYTHON_PREFIX="$(arch -arm64 brew --prefix "python@${PYTHON_VERSION}")"

          echo "GTK_PREFIX=${GTK_PREFIX}" >> "$GITHUB_ENV"
          echo "PYTHON_PREFIX=${PYTHON_PREFIX}" >> "$GITHUB_ENV"

          # GNU make must appear as `make`, not only as `gmake`.
          echo "${BREW_PREFIX}/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "${PYTHON_PREFIX}/bin" >> "$GITHUB_PATH"

          # Make absolutely sure every probe sees the ARM tools.
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${PYTHON_PREFIX}/bin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PATH}"

          command -v make
          make --version | head -1
          command -v pkg-config
          pkg-config --version
          pkg-config --modversion gtk+-3.0

          arch -arm64 brew list --versions make gtk+3 python@3.14

      - name: Install native ARM64 Alire
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p .ci/alire_bin
          cd .ci/alire_bin

          curl -fL             -o alire.zip             "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-aarch64-macos.zip"

          unzip -q -o alire.zip "bin/alr*" 
          rm alire.zip

          chmod +x bin/alr*
          echo "$GITHUB_WORKSPACE/.ci/alire_bin/bin" >> "$GITHUB_PATH"

          file "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr"
          "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr" --version

          # Hard fail if Alire accidentally runs as x86_64/Rosetta.
          file "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr" | grep -q 'arm64'
          test "$(arch -arm64 "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr" --version >/dev/null; echo $?)" = 0

          "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr" version | sed -n '1,120p'

      - name: Install GNAT / GPRBuild through native Alire
        shell: bash
        run: |
          set -euxo pipefail

          ALR="$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr"
          export PATH="$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          rm -rf "$ALIRE_PREFIX"

          "$ALR" -n install             gnat_native=16.1.0             gprbuild=26.0.1             --prefix="$ALIRE_PREFIX"

          test -x "$ALIRE_PREFIX/bin/gnat"
          test -x "$ALIRE_PREFIX/bin/gprbuild"

          echo "$ALIRE_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Check Ada toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ALIRE_PREFIX/bin:$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          command -v alr
          command -v gnat
          command -v gprbuild

          echo '--- Alire ---'
          alr --version

          echo '--- GNAT ---'
          gnat --version

          echo '--- GPRBuild ---'
          gprbuild --version

          echo '--- Architectures ---'
          file "$(command -v alr)"
          file "$(command -v gnat)"
          file "$(command -v gprbuild)"

          echo '--- Target ---'
          gnat -v 2>&1 | sed -n '1,24p'

      - name: Resolve GNAT Studio Ada dependencies
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ALIRE_PREFIX/bin:$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          rm -rf .ci/gnatstudio-deps
          mkdir -p .ci/gnatstudio-deps
          cd .ci/gnatstudio-deps

          alr init --bin gnatstudio-deps

          # Ensure Alire itself and the subprocesses it launches use native ARM Homebrew.
          export HOMEBREW_PREFIX="${BREW_PREFIX}"
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PATH}"

          make --version | head -1
          pkg-config --modversion gtk+-3.0
          arch -arm64 brew info --json=v1 make gtk+3 | head -c 2000 || true

          alr -d with gtkada=26.0.0
          alr -d with xmlada=26.0.0
          alr -d with gnatcoll=26.0.0
          alr -d with gnatcoll_projects=26.0.0
          alr -d with vss_extra=26.2.0
          alr -d with vss_text=26.2.0

          alr printenv --unix > "$GITHUB_WORKSPACE/.ci/alire-env.sh"

          echo '--- Alire dependency solution ---'
          alr with

          echo '--- Alire environment ---'
          cat "$GITHUB_WORKSPACE/.ci/alire-env.sh"

      - name: Build GNATcoll Python 3 binding
        shell: bash
        run: |
          set -euxo pipefail

          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${PATH}"
          export PYTHON="${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}"
          export MACOSX_DEPLOYMENT_TARGET=27.0

          rm -rf .ci/gnatcoll-bindings
          git clone --depth 1 https://github.com/AdaCore/gnatcoll-bindings.git .ci/gnatcoll-bindings

          cd .ci/gnatcoll-bindings/python3
          "${PYTHON}" setup.py build --python-exec "${PYTHON}"
          "${PYTHON}" setup.py install --prefix="${GNATCOLL_PYTHON_PREFIX}"

          find "${GNATCOLL_PYTHON_PREFIX}" -maxdepth 5 -type f | sort | sed -n '1,200p'

      - name: Compose GPR / linker environment
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh

          GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          ADA_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${ADA_PROJECT_PATH:-}"
          LIBRARY_PATH="${GNATCOLL_PYTHON_PREFIX}/lib:${LIBRARY_PATH:-}"
          DYLD_LIBRARY_PATH="${GNATCOLL_PYTHON_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"

          echo "GPR_PROJECT_PATH=${GPR_PROJECT_PATH}" >> "$GITHUB_ENV"
          echo "ADA_PROJECT_PATH=${ADA_PROJECT_PATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

          test -d "${GNATCOLL_PYTHON_PREFIX}/share/gpr"
          find "${GNATCOLL_PYTHON_PREFIX}/share/gpr" -maxdepth 1 -type f -print | sort

      - name: Configure GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail

          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${PATH}"
          export CC=clang
          export CXX=clang++
          export MACOSX_DEPLOYMENT_TARGET=27.0
          export CFLAGS="-O2 -mmacosx-version-min=27.0"
          export CXXFLAGS="-O2 -mmacosx-version-min=27.0"
          export LDFLAGS="-mmacosx-version-min=27.0"

          echo '--- Configure inputs ---'
          command -v gnat
          command -v gprbuild
          command -v make
          command -v pkg-config
          pkg-config --modversion gtk+-3.0
          printf '%s\n' "${GPR_PROJECT_PATH}"

          ./configure             --prefix="$GITHUB_WORKSPACE/_install"             --disable-shared

      - name: Build GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail

          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${PATH}"
          export MACOSX_DEPLOYMENT_TARGET=27.0

          make BUILD=Production -j"$(sysctl -n hw.ncpu)"

      - name: Install GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail

          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${PATH}"
          export MACOSX_DEPLOYMENT_TARGET=27.0

          make install-strip prefix="$GITHUB_WORKSPACE/_install"

          test -x _install/bin/gnatstudio_exe
          test -x _install/bin/gnatstudio

          file _install/bin/gnatstudio_exe
          otool -hv _install/bin/gnatstudio_exe

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: gnatstudio-macos27-arm64-install-${{ github.sha }}
          path: _install
          if-no-files-found: error
