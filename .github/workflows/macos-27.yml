name: GNAT Studio - macOS 27 ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-macos-27:
    name: Build GNAT Studio on macOS 27 ARM64
    runs-on: xcode-27

    env:
      MACOSX_DEPLOYMENT_TARGET: '27.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      PYTHON_VERSION: '3.14'
      ALIRE_VERSION: '2.1.1'
      ALIRE_PREFIX: '${{ github.workspace }}/.ci/alire_prefix'
      GNATCOLL_PYTHON_PREFIX: '${{ github.workspace }}/.ci/gnatcoll-python3'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Inspect runner
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          echo "uname -m: $(uname -m)"
          echo "arch: $(arch)"
          test "$(uname -m)" = arm64
          test "$(arch)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Configure native ARM Homebrew
        shell: bash
        run: |
          set -euxo pipefail

          BREW_PREFIX="$(/usr/bin/arch -arm64 /usr/bin/env brew --prefix)"
          test "$BREW_PREFIX" = "/opt/homebrew"

          echo "BREW_PREFIX=${BREW_PREFIX}" >> "$GITHUB_ENV"

          # IMPORTANT:
          # Alire itself executes a bare `brew` command. Put this wrapper FIRST
          # in PATH so Alire can never invoke /usr/local/bin/brew or a Rosetta
          # Homebrew instance.
          mkdir -p "$GITHUB_WORKSPACE/.ci/bin"

          cat > "$GITHUB_WORKSPACE/.ci/bin/brew" <<'EOF'
          #!/bin/bash
          set -e
          exec /usr/bin/arch -arm64 /opt/homebrew/bin/brew "$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/.ci/bin/brew"

          echo "$GITHUB_WORKSPACE/.ci/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"

          export PATH="$GITHUB_WORKSPACE/.ci/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

          command -v brew
          file "$(command -v brew)"
          brew --version
          brew config | sed -n '1,100p'

          # The wrapper must force native ARM even when called by another process.
          /usr/bin/arch -arm64 brew --version >/dev/null

          # Verify the actual executable selected by Homebrew.
          file /opt/homebrew/bin/brew

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/.ci/bin:/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

          brew install             make             pkgconf             gtk+3             gobject-introspection             pygobject3             py3cairo             python@3.14             dylibbundler

          GTK_PREFIX="$(brew --prefix gtk+3)"
          PYTHON_PREFIX="$(brew --prefix "python@${PYTHON_VERSION}")"

          echo "GTK_PREFIX=${GTK_PREFIX}" >> "$GITHUB_ENV"
          echo "PYTHON_PREFIX=${PYTHON_PREFIX}" >> "$GITHUB_ENV"

          echo "${BREW_PREFIX}/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "${PYTHON_PREFIX}/bin" >> "$GITHUB_PATH"

          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${PYTHON_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PATH}"

          command -v brew
          command -v make
          command -v pkg-config
          make --version | head -1
          pkg-config --version
          pkg-config --modversion gtk+-3.0

          echo '--- Homebrew package state ---'
          brew list --versions make gtk+3 python@3.14
          brew info --json=v1 make | python3 -m json.tool | sed -n '1,120p'

      - name: Install native ARM64 Alire
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .ci/alire_bin
          mkdir -p .ci/alire_bin
          cd .ci/alire_bin

          for i in 1 2 3 4 5; do
            curl -fL -o alire.zip \
              "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-aarch64-macos.zip" && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          test -f alire.zip

          unzip -q -o alire.zip "bin/alr*"
          rm alire.zip
          chmod +x bin/alr*

          file "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr"
          "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr" --version

          file "$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr" | grep -qi arm64

          echo "$GITHUB_WORKSPACE/.ci/alire_bin/bin" >> "$GITHUB_PATH"

      - name: Install GNAT / GPRBuild through native Alire
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/.ci/bin:$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          ALR="$GITHUB_WORKSPACE/.ci/alire_bin/bin/alr"
          rm -rf "$ALIRE_PREFIX"

          "$ALR" -n install             gnat_native=16.1.0             gprbuild=26.0.1             --prefix="$ALIRE_PREFIX"

          test -x "$ALIRE_PREFIX/bin/gnat"
          test -x "$ALIRE_PREFIX/bin/gprbuild"

          echo "$ALIRE_PREFIX/bin" >> "$GITHUB_PATH"

      - name: Check Ada toolchain
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$ALIRE_PREFIX/bin:$GITHUB_WORKSPACE/.ci/bin:$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          command -v alr
          command -v gnat
          command -v gprbuild
          command -v brew

          echo '--- Toolchain ---'
          alr --version
          gnat --version
          gprbuild --version

          echo '--- Architecture ---'
          file "$(command -v alr)"
          file "$(command -v gnat)"
          file "$(command -v gprbuild)"
          file "$(command -v brew)"

          echo '--- Target ---'
          gnat -v 2>&1 | sed -n '1,30p'

      - name: Resolve GNAT Studio Ada dependencies
        shell: bash
        run: |
          set -euxo pipefail

          export PATH="$GITHUB_WORKSPACE/.ci/bin:$ALIRE_PREFIX/bin:$GITHUB_WORKSPACE/.ci/alire_bin/bin:${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${PATH}"

          echo '--- Effective brew ---'
          command -v brew
          file "$(command -v brew)"
          brew config | grep -E 'HOMEBREW_PREFIX|CPU|macOS|Rosetta' || true

          # DNS warmup — GitHub runners sometimes have transient resolution failures
          for _ in 1 2 3; do
            curl -sf https://github.com >/dev/null 2>&1 && break || sleep 2
          done

          alr toolchain --select gnat_native=16.1.0 gprbuild=26.0.1

          rm -rf .ci/gnatstudio-deps
          mkdir -p .ci/gnatstudio-deps
          cd .ci/gnatstudio-deps

          alr -n init --bin gnatstudiodeps
          cd gnatstudiodeps

          for dep in "gtkada=26.0.0" "xmlada=26.0.0" "gnatcoll=26.0.0" \
                     "gnatcoll_projects=26.0.0" "vss_extra=26.2.0" "vss_text=26.2.0"; do
            for attempt in 1 2 3; do
              alr with "${dep}" && break || { echo "retry alr with ${dep}"; sleep 5; }
            done
          done

          alr update

          alr printenv --unix > "$GITHUB_WORKSPACE/.ci/alire-env.sh"

          echo '--- Alire environment ---'
          cat "$GITHUB_WORKSPACE/.ci/alire-env.sh"

      - name: Build GNATcoll Python 3 binding
        shell: bash
        run: |
          set -euxo pipefail

          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"
          export PYTHON="${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}"
          export MACOSX_DEPLOYMENT_TARGET=27.0

          rm -rf .ci/gnatcoll-bindings
          git clone --depth 1 --branch v26.0.0 https://github.com/AdaCore/gnatcoll-bindings.git .ci/gnatcoll-bindings

          cd .ci/gnatcoll-bindings/python3

          PYTHON_CFLAGS="-I$("${PYTHON}" -c 'import sysconfig; print(sysconfig.get_path("include"))')"
          PYTHON_LIBS="-L$("${PYTHON}" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))') -lpython${PYTHON_VERSION}"

          GPRBUILD_REAL="$(find "${HOME}/.local/share/alire/toolchains" "${ALIRE_PREFIX}/bin" -name gprbuild -type f 2>/dev/null | head -1)"

          # Collect all -aP flags from GPR_PROJECT_PATH
          AP_FLAGS=""
          OLD_IFS="${IFS}"
          IFS=":"
          for p in ${GPR_PROJECT_PATH}; do
            [ -d "${p}" ] && AP_FLAGS="${AP_FLAGS} -aP ${p}"
          done
          IFS="${OLD_IFS}"
          echo "Extra -aP flags: ${AP_FLAGS}"

          "${GPRBUILD_REAL}" -j0 -p \
            ${AP_FLAGS} \
            -Pgnatcoll_python.gpr \
            --target=aarch64-darwin \
            -XGNATCOLL_PYTHON_CFLAGS="${PYTHON_CFLAGS}" \
            -XGNATCOLL_PYTHON_LIBS="${PYTHON_LIBS}" \
            -XGNATCOLL_LIBPYTHON_KIND=shared \
            -XGNATCOLL_VERSION=0.0 \
            -XBUILD=PROD \
            -XGNATCOLL_OS=osx \
            -XLIBRARY_TYPE=static \
            -XXMLADA_BUILD=static \
            -XGPR_BUILD=static

          mkdir -p "${GNATCOLL_PYTHON_PREFIX}/lib"
          mkdir -p "${GNATCOLL_PYTHON_PREFIX}/share/gpr"
          cp -v lib/*.a "${GNATCOLL_PYTHON_PREFIX}/lib/" 2>/dev/null || true
          cp -v lib/*.so "${GNATCOLL_PYTHON_PREFIX}/lib/" 2>/dev/null || true
          cp -v lib/*.dylib "${GNATCOLL_PYTHON_PREFIX}/lib/" 2>/dev/null || true
          cp -v lib/gnatcoll_python3*.ali "${GNATCOLL_PYTHON_PREFIX}/lib/" 2>/dev/null || true
          cp -v gnatcoll_python.gpr "${GNATCOLL_PYTHON_PREFIX}/share/gpr/" 2>/dev/null || true

      - name: Compose GPR environment
        shell: bash
        run: |
          set -euxo pipefail

          source .ci/alire-env.sh

          GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          ADA_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${ADA_PROJECT_PATH:-}"
          LIBRARY_PATH="${GNATCOLL_PYTHON_PREFIX}/lib:${LIBRARY_PATH:-}"
          DYLD_LIBRARY_PATH="${GNATCOLL_PYTHON_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"

          sed -i.bak "s|^export GPR_PROJECT_PATH=.*|export GPR_PROJECT_PATH=\\\"${GPR_PROJECT_PATH}\\\"|" \
            "$GITHUB_WORKSPACE/.ci/alire-env.sh"

          echo "GPR_PROJECT_PATH=${GPR_PROJECT_PATH}" >> "$GITHUB_ENV"
          echo "ADA_PROJECT_PATH=${ADA_PROJECT_PATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

          find "${GNATCOLL_PYTHON_PREFIX}/share/gpr" -maxdepth 1 -type f -print | sort

      - name: Configure GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          export ADA_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${ADA_PROJECT_PATH:-}"
          export LIBRARY_TYPE=static
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"

          # Create missing shared .gpr stubs in Alire cache
          # Sub-projects (xmlada_sax.gpr, gtkada.gpr) import "../xmlada_shared" / "../gtkada_shared"
          # via relative paths that resolve to the Alire cache parent dir, which doesn't have them
          echo '--- Creating missing shared .gpr stubs in Alire cache ---'
          for d in $(find "${HOME}/.local/share/alire/builds" -name "xmlada_sax.gpr" -exec dirname {} \; 2>/dev/null); do
            parent="$(dirname "$d")"
            if [ ! -f "$parent/xmlada_shared.gpr" ]; then
              echo "Creating $parent/xmlada_shared.gpr"
              printf 'project Xmlada_Shared is\nend Xmlada_Shared;\n' > "$parent/xmlada_shared.gpr"
            fi
          done
          for d in $(find "${HOME}/.local/share/alire/builds" -name "gtkada.gpr" -path "*/src/*" -exec dirname {} \; 2>/dev/null); do
            parent="$(dirname "$d")"
            if [ ! -f "$parent/gtkada_shared.gpr" ]; then
              echo "Creating $parent/gtkada_shared.gpr"
              printf 'project Gtkada_Shared is\nend Gtkada_Shared;\n' > "$parent/gtkada_shared.gpr"
            fi
          done

          # Also ensure the shared .gpr files exist at the workspace root for the
          # copy loop in the alire-env.sh GPR_PROJECT_PATH resolution
          for p in $(echo "${GPR_PROJECT_PATH}" | tr ':' ' '); do
            [ -d "${p}" ] || continue
            for f in "${p}"/*.gpr; do
              [ -f "${f}" ] || continue
              bn="$(basename "${f}")"
              [ -f "${bn}" ] || cp -p "${f}" "${bn}"
            done
          done

          # Bypass configure's project checks: sed the simple HAVE_GNAT_PROJECT checks
          sed -i '' 's|HAVE_GNAT_PROJECT_xmlada=no|HAVE_GNAT_PROJECT_xmlada=yes|g' configure
          sed -i '' 's|HAVE_GNAT_PROJECT_gtkada=no|HAVE_GNAT_PROJECT_gtkada=yes|g' configure
          # Also bypass the deeper AM_PATH_GTKADA compilation test error
          # (it fails because libraries aren't built yet at configure time)
          sed -i '' 's|as_fn_error \$? "Test for GtkAda failed|"as_fn_warn \$? "TEST FOR GTKADA SKIPPED|"g' configure

          ./configure             --prefix="$GITHUB_WORKSPACE/_install"

      - name: Build GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"
          export MACOSX_DEPLOYMENT_TARGET=27.0

          make BUILD=Production -j"$(sysctl -n hw.ncpu)"

      - name: Install GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${BREW_PREFIX}/bin:${BREW_PREFIX}/sbin:${PYTHON_PREFIX}/bin:${ALIRE_PREFIX}/bin:${GITHUB_WORKSPACE}/.ci/bin:${GITHUB_WORKSPACE}/.ci/alire_bin/bin:${PATH}"

          make install-strip prefix="$GITHUB_WORKSPACE/_install"

          test -x _install/bin/gnatstudio_exe
          test -x _install/bin/gnatstudio

          file _install/bin/gnatstudio_exe
          otool -hv _install/bin/gnatstudio_exe

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: gnatstudio-macos27-arm64-install-${{ github.sha }}
          path: _install
          if-no-files-found: error
