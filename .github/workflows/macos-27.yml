name: GNAT Studio - macOS 27 ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos-27:
    name: Build GNAT Studio on macOS 27 ARM64
    # macOS 27 ARM64 public-preview image.
    # Change to xcode-27-xlarge when larger runners are enabled for the repo.
    runs-on: xcode-27

    env:
      MACOSX_DEPLOYMENT_TARGET: '27.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      PYTHON_VERSION: '3.14'
      GNATCOLL_PYTHON_PREFIX: '${{ github.workspace }}/.ci/gnatcoll-python3'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Inspect runner
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk macosx --show-sdk-path

      - name: Install native dependencies
        shell: bash
        run: |
          set -euxo pipefail
          brew install \
            make \
            pkgconf \
            gtk+3 \
            gobject-introspection \
            pygobject3 \
            py3cairo \
            python@3.14 \
            dylibbundler

      - name: Configure Homebrew / Python environment
        shell: bash
        run: |
          set -euxo pipefail

          BREW_PREFIX="$(brew --prefix)"
          GTK_PREFIX="$(brew --prefix gtk+3)"
          PYTHON_PREFIX="$(brew --prefix "python@${PYTHON_VERSION}")"

          echo "BREW_PREFIX=${BREW_PREFIX}" >> "$GITHUB_ENV"
          echo "GTK_PREFIX=${GTK_PREFIX}" >> "$GITHUB_ENV"
          echo "PYTHON_PREFIX=${PYTHON_PREFIX}" >> "$GITHUB_ENV"

          # GNU make must precede Apple's BSD make.
          echo "${BREW_PREFIX}/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          echo "${PYTHON_PREFIX}/bin" >> "$GITHUB_PATH"

          PKG_CONFIG_PATH="${GTK_PREFIX}/lib/pkgconfig:${GTK_PREFIX}/share/pkgconfig:${PYTHON_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/lib/pkgconfig:${BREW_PREFIX}/share/pkgconfig"
          if [[ -n "${PKG_CONFIG_PATH:-}" ]]; then
            :
          fi
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

          echo "PYTHON=${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}" >> "$GITHUB_ENV"

          "${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}" --version
          pkg-config --modversion gtk+-3.0
          pkg-config --exists python3-embed || true
          "${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}" - <<'PY'
          import sys
          import sysconfig
          print("Python:", sys.executable)
          print("include:", sysconfig.get_path("include"))
          print("platinclude:", sysconfig.get_path("platinclude"))
          print("libdir:", sysconfig.get_config_var("LIBDIR"))
          print("LDLIBRARY:", sysconfig.get_config_var("LDLIBRARY"))
          print("LIBPL:", sysconfig.get_config_var("LIBPL"))
          print("LIBRARY:", sysconfig.get_config_var("LIBRARY"))
          print("PY_ENABLE_SHARED:", sysconfig.get_config_var("PY_ENABLE_SHARED"))
          print("PYTHONFRAMEWORK:", sysconfig.get_config_var("PYTHONFRAMEWORK"))
          PY

      - name: Install GNAT / GPRBuild through Alire
        uses: alire-project/alr-install@v2
        with:
          crates: gnat_native gprbuild
          prefix: alire_prefix
          add_to_path: true

      - name: Check Ada toolchain
        shell: bash
        run: |
          set -euxo pipefail
          command -v alr
          command -v gnat
          command -v gprbuild
          alr --version
          gnat --version
          gprbuild --version
          file "$(command -v gnat)"
          file "$(command -v gprbuild)"

      - name: Resolve GNAT Studio Ada dependencies
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .ci/gnatstudio-deps
          mkdir -p .ci/gnatstudio-deps
          cd .ci/gnatstudio-deps

          # Do not add `gnatcoll_python`: that Alire crate is the obsolete
          # Python 2 binding (21.0.0), not the Python 3 binding GNAT Studio uses.
          # VSS extra is 26.0.0; VSS text is 26.2.0.
          alr init --bin gnatstudio-deps
          alr with gtkada^26.0.0
          alr with xmlada^26.0.0
          alr with gnatcoll^26.0.0
          alr with vss_extra^26.0.0
          alr with vss_text^26.2.0

          alr build
          alr printenv --unix > "$GITHUB_WORKSPACE/.ci/alire-env.sh"

          echo '--- Alire environment ---'
          cat "$GITHUB_WORKSPACE/.ci/alire-env.sh"

      - name: Build GNATcoll Python 3 binding for macOS
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh

          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${PYTHON_PREFIX}/bin:${PATH}"
          export PYTHON="${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}"
          export MACOSX_DEPLOYMENT_TARGET=27.0

          rm -rf .ci/gnatcoll-bindings
          git clone --depth 1 https://github.com/AdaCore/gnatcoll-bindings.git .ci/gnatcoll-bindings

          test -f .ci/gnatcoll-bindings/version_information
          echo '--- GNATcoll bindings version ---'
          cat .ci/gnatcoll-bindings/version_information
          grep -Eq '^26\.' .ci/gnatcoll-bindings/version_information

          # GNAT Studio needs GNATCOLL.Scripts.Python.  The community Alire
          # gnatcoll_python crate is Python 2; the python3 crate is not currently
          # indexed for macOS, so build the upstream python3 component directly.
          cd .ci/gnatcoll-bindings/python3
          "${PYTHON}" setup.py build --python-exec "${PYTHON}"
          "${PYTHON}" setup.py install \
            --prefix="${GNATCOLL_PYTHON_PREFIX}"

          echo '--- Installed GNATcoll Python 3 ---'
          find "${GNATCOLL_PYTHON_PREFIX}" -maxdepth 4 -type f | sort | sed -n '1,160p'

      - name: Compose GPR / linker environment
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh

          GPR_PROJECT_PATH="${GNATCOLL_PYTHON_PREFIX}/share/gpr:${GPR_PROJECT_PATH:-}"
          LIBRARY_PATH="${GNATCOLL_PYTHON_PREFIX}/lib:${LIBRARY_PATH:-}"
          DYLD_LIBRARY_PATH="${GNATCOLL_PYTHON_PREFIX}/lib:${DYLD_LIBRARY_PATH:-}"

          echo "GPR_PROJECT_PATH=${GPR_PROJECT_PATH}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

          echo '--- GPR projects ---'
          find "${GNATCOLL_PYTHON_PREFIX}/share/gpr" -maxdepth 1 -type f -print | sort

          test -f "${GNATCOLL_PYTHON_PREFIX}/share/gpr/gnatcoll_python.gpr"

      - name: Configure GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh

          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${PYTHON_PREFIX}/bin:${PATH}"
          export PYTHON="${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}"
          export CC=clang
          export CXX=clang++
          export MACOSX_DEPLOYMENT_TARGET=27.0
          export CFLAGS="-O2 -mmacosx-version-min=27.0"
          export CXXFLAGS="-O2 -mmacosx-version-min=27.0"
          export LDFLAGS="-mmacosx-version-min=27.0"

          ./configure \
            --prefix="$GITHUB_WORKSPACE/_install" \
            --disable-shared

      - name: Build GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${PYTHON_PREFIX}/bin:${PATH}"
          export MACOSX_DEPLOYMENT_TARGET=27.0
          make BUILD=Production -j"$(sysctl -n hw.ncpu)"

      - name: Install GNAT Studio
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${PYTHON_PREFIX}/bin:${PATH}"
          export MACOSX_DEPLOYMENT_TARGET=27.0
          make install-strip prefix="$GITHUB_WORKSPACE/_install"

          test -x _install/bin/gnatstudio_exe
          test -x _install/bin/gnatstudio
          file _install/bin/gnatstudio_exe
          otool -hv _install/bin/gnatstudio_exe

      - name: Build self-contained GNAT Studio.app
        shell: bash
        run: |
          set -euxo pipefail
          source .ci/alire-env.sh
          export PATH="${BREW_PREFIX}/opt/make/libexec/gnubin:${PYTHON_PREFIX}/bin:${PATH}"
          export PYTHON="${PYTHON_PREFIX}/bin/python${PYTHON_VERSION}"
          export MACOSX_DEPLOYMENT_TARGET=27.0

          cd osx_bundle
          make clean || true
          make dmg \
            PREFIX="$GITHUB_WORKSPACE/_bundle" \
            GTK_PREFIX="$GTK_PREFIX" \
            PYTHON="$PYTHON"

      - name: Validate bundle
        shell: bash
        run: |
          set -euxo pipefail

          APP="_bundle/GNAT Studio.app"
          DMG="$(find _bundle -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          test -d "$APP"
          test -n "$DMG"
          test -f "$APP/Contents/Info.plist"
          test -x "$APP/Contents/MacOS/gps"
          test -x "$APP/Contents/MacOS/bin/gnatstudio_exe"
          test -d "$APP/Contents/Frameworks"
          test -d "$APP/Contents/MacOS/lib"

          /usr/bin/plutil -lint "$APP/Contents/Info.plist"
          /usr/bin/plutil -p "$APP/Contents/Info.plist"

          file "$APP/Contents/MacOS/bin/gnatstudio_exe"
          otool -arch arm64 -hv "$APP/Contents/MacOS/bin/gnatstudio_exe"

          echo '--- External Homebrew references ---'
          bad=0
          while IFS= read -r -d '' macho; do
            if otool -L "$macho" | grep -E '/opt/homebrew/|/usr/local/opt/|/Cellar/' >/dev/null 2>&1; then
              echo "EXTERNAL LINK: $macho"
              otool -L "$macho"
              bad=1
            fi
          done < <(
            find "$APP/Contents" -type f \( \
              -name '*.dylib' -o -name '*.so' -o -name '*.bundle' -o \
              -name 'gnatstudio_exe' -o -name 'gdk-pixbuf-query-loaders' \
            \) -print0
          )
          test "$bad" -eq 0

          codesign --verify --deep --strict --verbose=2 "$APP"
          hdiutil imageinfo "$DMG" >/dev/null

      - name: Create distributable app archive
        shell: bash
        run: |
          set -euxo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            "_bundle/GNAT Studio.app" \
            "_bundle/GNAT-Studio-macos27-arm64.zip"

      - name: Upload macOS 27 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gnatstudio-macos27-arm64
          if-no-files-found: error
          path: |
            _bundle/*.dmg
            _bundle/*.zip
